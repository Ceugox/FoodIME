name: Admin CI

on:
  pull_request:
    paths:
      - 'admin/**'
  push:
    branches:
      - main
    paths:
      - 'admin/**'

jobs:
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - run: npm run lint

      - run: npm run build
