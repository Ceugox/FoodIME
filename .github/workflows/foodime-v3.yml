name: FoodIME V3 CI/CD

on:
  pull_request:
    paths:
      - 'foodime-v3/**'
      - 'railway.json'
  push:
    branches:
      - main
    paths:
      - 'foodime-v3/**'
      - 'railway.json'
      - '.github/workflows/foodime-v3.yml'
      - '.github/workflows/deploy.yml'

jobs:
  build:
    name: Build FoodIME V3
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foodime-v3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: foodime-v3/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?pgbouncer=true
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
          JWT_SECRET: test-secret-min-32-chars-for-ci
          JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars
          MERCADOPAGO_ACCESS_TOKEN: TEST-ACCESS-TOKEN
          MERCADOPAGO_WEBHOOK_SECRET: test-webhook-secret
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_KEY: test-service-key
          NEXT_PUBLIC_APP_URL: https://foodime.example.com
          CRON_SECRET: test-cron-secret

  deploy:
    name: Deploy FoodIME V3
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm i -g @railway/cli
          railway up --service backend
