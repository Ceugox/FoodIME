name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Prisma schema diff (dry-run)
        run: npx prisma@6 migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script

      - name: Unit tests
        run: npm test -- --passWithNoTests --forceExit
        env:
          JWT_SECRET: test-secret-min-32-chars-for-testing
          JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars-for-testing
          NODE_ENV: test

      - name: E2E tests
        run: npm run test:e2e -- --passWithNoTests --forceExit
        env:
          JWT_SECRET: test-secret-min-32-chars-for-testing
          JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars-for-testing
          NODE_ENV: test

      - run: npm run build

  docker:
    name: Build & Push Docker Image
    needs: lint-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}/backend:${{ github.sha }} ./backend

      - name: Push image to GHCR
        run: docker push ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

  deploy:
    name: Deploy to Railway
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm i -g @railway/cli
          railway up --service backend
